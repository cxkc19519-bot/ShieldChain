name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Check dependency consistency
        run: |
          python -m pip check
          npm ls --prefix frontend --all
      - name: Run deterministic quality gates
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify.ps1 -StaticOnly
      - name: Run static container and supply-chain contracts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\scripts\run-phase8-container-smoke.ps1 -StaticOnly

  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock
      - name: Build and smoke Compose
        shell: pwsh
        run: ./tests/scripts/run-phase8-container-smoke.ps1
