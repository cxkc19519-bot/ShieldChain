[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shieldchain"
version = "0.1.0"
description = "ShieldChain backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.15,<4.16",
    "defusedxml>=0.7,<0.8",
    "fastapi>=0.115",
    "httpx>=0.28",
    "httpx2>=2,<3",
    "mcp>=2,<3",
    "openpyxl>=3.1,<3.2",
    "pypdf>=6.14,<6.15",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10,<3",
    "PyYAML>=6,<7",
    "python-multipart>=0.0.20,<0.1",
    "python-docx>=1.2,<1.3",
    "sqlalchemy>=2.0",
    "structlog>=25.1",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
local-rag = [
    "FlagEmbedding>=1.4,<1.5",
    "huggingface_hub>=1.0,<2",
    "pymilvus>=2.6,<2.7",
    "transformers>=4.44,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shieldchain"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
